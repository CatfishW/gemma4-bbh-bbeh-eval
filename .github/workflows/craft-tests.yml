name: CRAFT mathematical and LoRA tests

on:
  push:
    paths:
      - 'rl_craft/**'
      - 'tests/test_craft_*.py'
      - 'experiments/craft/**'
      - '.github/workflows/craft-tests.yml'
  pull_request:
    paths:
      - 'rl_craft/**'
      - 'tests/test_craft_*.py'
      - 'experiments/craft/**'
      - '.github/workflows/craft-tests.yml'

permissions:
  contents: read

jobs:
  cpu-rl-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only test dependency
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Exhaustive gradient and LoRA tests
        run: python -m unittest discover -s tests -p 'test_craft_*.py' -v
      - name: Compile new Python modules
        run: python -m compileall -q rl_craft
      - name: CPU optimizer smoke and checkpoint resume
        run: |
          python -m rl_craft smoke --output /tmp/craft-ci --iterations 4
          python -m rl_craft smoke --output /tmp/craft-ci --iterations 4 --resume
