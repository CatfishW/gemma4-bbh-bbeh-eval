name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile Python sources
        run: python -m py_compile eval_benchmarks.py ops/*.py scripts/*.py rl/*.py
      - name: Validate shell scripts
        run: bash -n scripts/*.sh ops/*.sh
