name: Paper-grounded comparison suite
on:
  push:
    paths:
      - 'comparison_*.py'
      - 'tests/test_comparison_*.py'
      - 'experiments/comparison/**'
      - '.github/workflows/comparison-tests.yml'
  pull_request:
    paths:
      - 'comparison_*.py'
      - 'tests/test_comparison_*.py'
      - 'experiments/comparison/**'
      - '.github/workflows/comparison-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated CPU test dependency
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: New comparison and training tests
        run: python -m unittest discover -s tests -p 'test_comparison_*.py' -v
      - name: Existing CRAFT mathematical and training regressions
        run: python -m unittest discover -s tests -p 'test_craft_*.py' -v
      - name: Compile comparison entry points
        run: python -m py_compile comparison_*.py rl_craft/attention.py
      - name: Environment audit without model downloads
        run: python comparison_suite.py doctor --output /tmp/comparison-environment.json
