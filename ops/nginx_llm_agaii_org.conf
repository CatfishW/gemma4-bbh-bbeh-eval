# Install on tang-server-org in the active Nginx vhost tree.
# This proxy only rewrites the HTTP path. It does not inject or modify prompts.

server {
    listen 80;
    listen 127.0.0.1:4443 ssl http2;
    server_name llm.agaii.org;

    ssl_certificate     /www/server/panel/vhost/cert/llm.agaii.org/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/llm.agaii.org/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497 https://$host$request_uri;

    client_max_body_size 64m;

    location = /llm/v1 {
        return 308 /llm/v1/;
    }

    location ^~ /llm/v1/ {
        proxy_pass http://127.0.0.1:25570/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        return 404;
    }

    access_log /www/wwwlogs/llm.agaii.org.log;
    error_log /www/wwwlogs/llm.agaii.org.error.log;
}

