# Install on tang-server-org at:
# /www/server/panel/vhost/nginx/extension/llm.agaii.org/gemma4-llm-v1.conf
#
# Drop-in extension for the active llm.agaii.org vhost.
# Path-only proxy: does not alter request bodies or inject prompts.

location = /llm/v1 {
    return 308 /llm/v1/;
}

location ^~ /llm/v1/ {
    proxy_pass http://127.0.0.1:25570/v1/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 64m;
    proxy_connect_timeout 30s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;
    send_timeout 1800s;

    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    chunked_transfer_encoding on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;
    add_header X-Gemma4-Direct "sglang" always;

    if ($request_method = "OPTIONS") {
        return 204;
    }
}
